services:
  db:
    image: postgres:15
    volumes:
      - ./database/data:/var/lib/postgresql/data
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
    depends_on:
      - db

  # Flutter Web (Optional to Dockerize)
  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend